[project]
name = "scout-server"
version = "0.1.0"
description = "Scout server: the car link, the MCP endpoint and the website, in one program."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "starlette>=0.46",
    "uvicorn[standard]>=0.34",
    "mcp>=2.3,<3",
    "mcp-types>=2.3,<3",
    "anyio>=4.8",
    "httpx>=0.28",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.20",
    "pillow>=11",
    "numpy>=2",
    "onnxruntime>=1.20",
    "websockets>=14",
]

[project.scripts]
scout-server = "scout.__main__:main"
scout-sim = "scout_sim.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.11",
    "mypy>=1.15",
    "httpx2>=2.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout", "src/scout_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
